# VPS deployment is intentionally MANUAL while V1 is validated on a local laptop.
# Re-enable push-triggered deployment only after VPS configuration, network-cost
# snapshots, secrets and rollback behavior are revalidated for V1.
name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA a desplegar (vacío = HEAD de main)'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, vps, vps-arbitrage_bot]
    timeout-minutes: 90

    steps:
      - name: Desplegar en el host
        env:
          TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          /root/deploy/deploy.sh arbitrage_bot --sha "$TARGET_SHA"

      - name: Cola del log si falla
        if: failure()
        run: |
          log=$(ls -t /var/log/vps-deploy/arbitrage_bot-*.log 2>/dev/null | head -1)
          [ -n "$log" ] && tail -n 150 "$log"
